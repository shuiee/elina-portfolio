<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The same mark as the cursor, same path, same outline-with-no-fill
       treatment. See the cursor rule at the end of src/styles/base.css.

       Two differences, both forced by the 16px tab:
       1. The cursor carries a white halo so it stays visible over any part of
          the page. A favicon sits on the browser's own tab strip instead, so
          the halo is replaced by a colour-scheme query: ink on a light strip,
          paper on a dark one.
       2. The stroke is 2.4 rather than 1.5. At 1.5 the outline renders under
          one pixel at tab size and the mark greys out. -->
  <style>
    .mark { fill: none; stroke: #111111; stroke-width: 2.4; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .mark { stroke: #EDEDEB; } }
  </style>
  <path class="mark"
        d="M12 1.4C12.7 8.1 15.9 11.3 22.6 12C15.9 12.7 12.7 15.9 12 22.6C11.3 15.9 8.1 12.7 1.4 12C8.1 11.3 11.3 8.1 12 1.4Z"/>
</svg>
